# Регион: Прага с окрестностями до Брд (пробная карта).
# Файл читается build.sh как набор shell-переменных.

# Название карты (видно в списке карт на устройстве и в QMapShack).
NAME="Praha + Brdy"

# Исходные выгрузки OSM. Несколько адресов — через пробел:
# каждая вырезается по границам ниже, потом части склеиваются.
SOURCES="https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf"

# Границы: запад,юг,восток,север (градусы).
# В задании было 13.90–14.75 / 49.65–50.20; CHKO Brdy по данным OSM лежит в
# 13.654–14.005 / 49.538–49.818, поэтому запад и юг расширены.
BBOX="13.60,49.50,14.75,50.20"

# Вместо BBOX можно задать многоугольник (.poly или .geojson):
# POLY="regions/prague.poly"

# Id карты: 4 цифры, уникален для каждого региона.
# Он же family id (связывает карту с TYP) и префикс номеров тайлов (70010001, ...).
MAP_ID=7001

# Кодовая страница подписей. Только 1252: Edge 530/830 (и, судя по отчётам, все
# новые Edge) карту в 1250 показывают ромбами с «?» вместо каждой буквы, а Unicode
# от mkgmap не открывают совсем. Буквы, которых нет в 1252 (č ď ě ň ř ť ů),
# mkgmap сам заменяет на c d e n r t u; á é í ó ú ý š ž остаются. См. NOTES.md.
CODE_PAGE=1252
